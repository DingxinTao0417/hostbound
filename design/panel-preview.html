        reply({ type: 'chat_history', reqId: r, items: upto.slice(-(m.limit || 40)), more: false });
      } else if (m.type === 'info_query') {
        reply({ type: 'info', reqId: r, brain: { model: { provider: 'deepseek', id: 'deepseek-flash', name: 'DeepSeek V4.1 Flash' }, models: [{ provider: 'deepseek', id: 'deepseek-flash', name: 'DeepSeek V4.1 Flash' }, { provider: 'deepseek', id: 'deepseek-v4-pro', name: 'DeepSeek V4 Pro' }] }, mics: [{ name: '麦克风 (2- USB Microphone)', isDefault: true }, { name: '麦克风阵列 (Realtek(R) Audio)' }], engines: { cua: true, ocu: true }, voice: true });
      } else if (m.type === 'memory_query') reply({ type: 'memory', reqId: r, ...MEM });
      else if (m.type === 'memory_search') reply({ type: 'memory_hits', reqId: r, items: [{ ...MEM.files[1].entries[0], score: 0.03, kw: 0, cos: 0.82 }, { ...MEM.files[2].entries[0], score: 0.016, kw: 1.2, cos: null }] });
      else if (m.type === 'memory_edit' || m.type === 'memory_undo') reply({ type: 'memory_edited', reqId: r, ok: true });
      else if (m.type === 'memory_review') setTimeout(() => reply({ type: 'memory_reviewed', reqId: r, ok: true, change: { id: 'j3', summary: '没有要改的' } }), 800);
      else if (m.type === 'embed_test') reply({ type: 'embed_result', reqId: r, ok: true });
      else if (m.type === 'tasks_query') reply({ type: 'tasks', reqId: r, ...QUESTS });
      else if (m.type === 'projects_query') reply({ type: 'projects', reqId: r, items: [{ id: 'p1', name: '记账网站', card: PCARDS.running }, { id: 'p0', name: '贪吃蛇', card: { ...PCARDS.done, projectId: 'p0', name: '贪吃蛇', result: { ...PCARDS.done.result, did: '一个能玩的贪吃蛇，方向键控制，记最高分', url: '' } } }] });
      else if (m.type === 'project_action') reply({ type: 'project_action_result', reqId: r, ok: true, action: m.action });
      else if (m.type === 'skills_query') reply({ type: 'skills', reqId: r, ...SKILLS });
      else if (m.type === 'skill_decide') {
        SKILLS.pending = SKILLS.pending.filter((e) => e.id !== m.id);
        reply({ type: 'skill_decided', reqId: r, ok: true });
        reply({ type: 'skill_resolved', id: m.id, answer: m.answer, kind: /^s/.test(m.id) ? 'install' : /^i/.test(m.id) ? 'improve' : 'new', folder: m.answer === 'save' ? '开始做新一期' : null });
      } else if (m.type === 'skill_op') reply({ type: 'skill_op_done', reqId: r, ok: m.op !== 'triggers' || m.triggers.every((t) => t.length >= 3), error: '口令太短（至少 3 个字）' });
      else if (m.type === 'skill_diff') reply({ type: 'skill_diff', reqId: r, before: '1. 建文件夹\n3. 打开剪映', after: '1. 建文件夹\n3. 打开剪映\n   - 弹更新提示就点以后再说' });
      else if (m.type === 'skill_install') setTimeout(() => reply({ type: 'skill_install_result', reqId: r, ok: true, source: 'github.com/badlogic/pi-skills', candidates: m.pick ? null : [{ name: 'youtube-transcript', description: '取 YouTube 字幕', rel: 'youtube-transcript' }, { name: 'brave-search', description: '用 Brave 搜网页', rel: 'brave-search' }], pending: m.pick ? SKILLS.pending[1] : null }), 900);
      else if (m.type === 'task_cancel') { QUESTS.tasks = QUESTS.tasks.filter((t) => t.id !== m.id); QUESTS.watches = QUESTS.watches.filter((t) => t.id !== m.id); reply({ type: 'tasks', ...QUESTS }); }
      else if (m.type === 'ping') reply({ type: 'ping_result', reqId: r, ms: 1280 });
      else if (m.type === 'check_keyword') reply({ type: 'keyword_check', reqId: r, ok: true, missing: [] });
      else if (m.type === 'prompt') {
        if (/设置|日志|记录/.test(m.text)) return reply({ type: 'nav', page: /设置/.test(m.text) ? 'set' : /日志/.test(m.text) ? 'log' : 'rec' });
        reply({ type: 'busy', busy: true });
        setTimeout(() => brainCb({ type: 'say_start', id: 9 }), 300);
        setTimeout(() => brainCb({ type: 'say', delta: '（预览）收到：' + m.text }), 500);
        setTimeout(() => brainCb({ type: 'say_end', id: 9 }), 600);
        setTimeout(() => brainCb({ type: 'busy', busy: false }), 700);
        setTimeout(() => brainCb({ type: 'done', text: '（预览）收到：' + m.text }), 750);
      }
    },
    setHit: () => {}, focus: () => {}, blur: () => {}, log: () => {}, dragEdge: () => {}, petRect: () => {},
    config: async () => ({ sleepAfterMs: 1e9, wakeWords: ['系统启动'], ui: { petSize: 76, chatWidth: 440, chatHeight: 540, sound: false, panelOpacity: 0.78, boot: false }, speech: { fx: 0.6, volume: 0.9 }, onboarded: !/guide/.test(location.hash) }),
    settings: async () => ({ values: { ...values }, defaults: { ...values }, speechMode: 'gpu', live: false, onboarded: true, version: '0.3.0', dataDir: 'D:\\workspace\\hostbound\\data' }),
    setSetting: async (k, v) => ((values[k] = v), { ok: true }),
    pickFolder: async () => 'D:\\work',
    openPath: () => {}, onboarded: () => {}, relaunch: () => {},
    secretStatus: async () => ({ siliconflow: 'file' }),
    setSecret: async () => ({ ok: true }),
  };
  // 面板的 HTML 直接用 index.html 里的，跟程序保持一致
  const html = await (await fetch('/index.html')).text();
  document.body.insertAdjacentHTML('afterbegin', html.match(/<body>([\s\S]*?)<script/)[1]);
  for (const src of ['/voice-fx.js', '/speech.js', '/pages.js', '/app.js', '/explain-cards.js', '/project-cards.js']) {
    await new Promise((ok) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      document.body.appendChild(s);
    });
  }
  setTimeout(() => {
    brainCb({ type: 'voice_ready', mic: '麦克风 (2- USB Microphone)', wakeWords: ['系统启动'], wakeEnabled: true });
    brainCb({ type: 'brain_ready', model: 'deepseek/deepseek-flash' });
    brainCb({ type: 'tasks', ...QUESTS });
    setTimeout(() => window.__cmd({ type: 'wake' }), 400);
  }, 300);
})();
</script>
